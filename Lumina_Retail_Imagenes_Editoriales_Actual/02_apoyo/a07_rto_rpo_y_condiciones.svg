<text x="700" y="594.0" text-anchor="middle" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#222222">Habilitar y probar una copia fuera de la región.</text>
<text x="700" y="629.88" text-anchor="middle" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#222222">El despliegue regional inicial no demuestra recuperación multirregión.</text>
